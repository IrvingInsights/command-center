name: Finance Email Cross-Check

on:
  # Runs every Monday at 9:00 AM ET (14:00 UTC)
  schedule:
    - cron: '0 14 * * 1'
  # Also runs on demand (via the Notion trigger link or GitHub UI)
  workflow_dispatch:

jobs:
  email-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install notion-client==2.2.1

      - name: Run Finance Email Cross-Check
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_FINANCE_TRANSACTIONS_DB_ID: ${{ secrets.NOTION_FINANCE_TRANSACTIONS_DB_ID }}
          NOTION_FINANCE_FLAGS_DB_ID: ${{ secrets.NOTION_FINANCE_FLAGS_DB_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Optional: change lookback window (default 30 days)
          # FINANCE_EMAIL_LOOKBACK_DAYS: "60"
        run: python finance_email_check.py
