name: Finance Email Cross-Check

on:
  workflow_dispatch:

jobs:
  email-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            notion-client==2.2.1 \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2 \
            google-api-python-client

      - name: Run Finance Email Cross-Check
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_FINANCE_TRANSACTIONS_DB_ID: ${{ secrets.NOTION_FINANCE_TRANSACTIONS_DB_ID }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          # Optional: override number of days to scan (default 30)
          # FINANCE_EMAIL_LOOKBACK_DAYS: "60"
        run: python finance_email_check.py
